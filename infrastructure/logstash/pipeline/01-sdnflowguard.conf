input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "project" => "SDNFlowGuard"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "sdnflowguard-events-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}