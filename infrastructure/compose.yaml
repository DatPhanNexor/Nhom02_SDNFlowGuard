# NOTE: Canonical Single Source of Truth for the 6-container SDNFlowGuard stack is ../docker-compose.yml
# This file provides a standalone infrastructure sub-stack for core SDN controller & ELK testing.
name: sdnflowguard-netsec

services:
  onos:
    image: onosproject/onos:2.7-latest
    container_name: sdnflowguard-onos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:6653:6653"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: sdnflowguard-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.1
    container_name: sdnflowguard-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: "-Xms384m -Xmx384m -XX:MaxDirectMemorySize=128m"
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_WORKERS: "1"
    mem_limit: 1536m
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.1
    container_name: sdnflowguard-kibana
    profiles:
      - ui
    restart: "no"
    environment:
      SERVER_NAME: "sdnflowguard-kibana"
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    mem_limit: 2g
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

volumes:
  esdata:
    external: true
    name: sdnflowguard-elasticsearch-data