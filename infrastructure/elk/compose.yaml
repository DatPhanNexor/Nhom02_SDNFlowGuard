# NOTE: Canonical Single Source of Truth for the 6-container SDNFlowGuard stack is ../../docker-compose.yml
# This file provides an isolated ELK-only test compose stack.
name: sdnflowguard-elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: sdnflowguard-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    mem_limit: 2g

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - esdata:/usr/share/elasticsearch/data

volumes:
  esdata:
    name: sdnflowguard-elasticsearch-data